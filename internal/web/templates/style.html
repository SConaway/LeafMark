{{define "style"}}
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff; --fg: #1f2937; --muted: #6b7280; --border: #e5e7eb;
    --accent: #2563eb; --accent-fg: #ffffff; --card: #f9fafb;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111827; --fg: #f3f4f6; --muted: #9ca3af; --border: #374151; --card: #1f2937; }
  }
  * { box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--fg); margin: 0; padding: 1.5rem;
    font-family: system-ui, -apple-system, sans-serif; line-height: 1.5;
    max-width: 640px; margin-inline: auto;
  }
  h1 { font-size: 1.4rem; }
  h2 { font-size: 1.05rem; margin-top: 2rem; }
  a { color: var(--accent); }
  .muted { color: var(--muted); font-size: 0.9rem; }
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 0.5rem;
    padding: 0.9rem 1rem; margin-bottom: 0.75rem;
  }
  .card form { margin: 0; }
  button, input[type=submit] {
    background: var(--accent); color: var(--accent-fg); border: none;
    border-radius: 0.375rem; padding: 0.5rem 0.9rem; font-size: 0.9rem; cursor: pointer;
  }
  button:hover, input[type=submit]:hover { opacity: 0.9; }
  input[type=text] {
    background: var(--bg); color: var(--fg); border: 1px solid var(--border);
    border-radius: 0.375rem; padding: 0.5rem 0.6rem; font-size: 0.9rem; width: 100%;
  }
  .row { display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; }
  .score { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 0.85rem; }
  .manual-form { display: flex; flex-direction: column; gap: 0.5rem; }
</style>
{{end}}
